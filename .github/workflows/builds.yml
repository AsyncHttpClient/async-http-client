name: Build Check

on:
  schedule:
    - cron: '0 12 * * *'

jobs:
  Verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6.0.0
        with:
          distribution: 'corretto'
          java-version: '11'
          cache-jdk: true
      - uses: ./.github/actions/setup-maven
      - name: Verify
        run: ./mvnw -B -ntp clean verify -DskipTests -Dgpg.skip=true

  RunOnLinux:
    runs-on: ubuntu-latest
    needs: Verify
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6.0.0
        with:
          distribution: 'corretto'
          java-version: '11'
          cache-jdk: true
      - uses: ./.github/actions/setup-maven
      - name: Run Tests
        run: ./mvnw -B -ntp test -Ddocker.tests=true -Dexternal.tests=true

  RunOnMacOs:
    runs-on: macos-latest
    needs: Verify
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6.0.0
        with:
          distribution: 'corretto'
          java-version: '11'
          cache-jdk: true
      - uses: ./.github/actions/setup-maven
      - name: Run Tests
        run: ./mvnw -B -ntp test -Dexternal.tests=true

  RunOnWindows:
    runs-on: windows-latest
    needs: Verify
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6.0.0
        with:
          distribution: 'corretto'
          java-version: '11'
          cache-jdk: true
      - uses: ./.github/actions/setup-maven
      - name: Run Tests
        run: ./mvnw.cmd -B -ntp test "-Dexternal.tests=true"
