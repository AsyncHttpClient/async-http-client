version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      dependencies:
        patterns:
          - "*"
    ignore:
      # Both are capped by the JDK baseline: Error Prone 2.32 and NullAway 0.13 dropped
      # JDK 11, so any bump breaks the build. Newer JDKs pick up newer versions via profile.
      - dependency-name: "com.google.errorprone:error_prone_core"
      - dependency-name: "com.uber.nullaway:nullaway"
      - dependency-name: "org.junit:junit-bom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.apache.tomcat.embed:tomcat-embed-core"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.mockito:mockito-core"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns:
          - "*"

  # "/" only covers .github/workflows, so the composite action needs its own entry.
  - package-ecosystem: "github-actions"
    directory: "/.github/actions/setup-maven"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns:
          - "*"
