worker_processes 1;

events {
    worker_connections 64;
}

http {
    server {
        listen 80;
        listen 443 ssl;

        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        location = /get {
            default_type application/json;
            return 200 '{"server":"ahc-test-target","path":"/get"}';
        }

        # page used by the *ToHttpsTarget tests
        location / {
            default_type text/html;
            return 200 '<html><head><title>AHC Test Target</title></head><body><h1>AHC Test Target</h1></body></html>';
        }
    }
}
